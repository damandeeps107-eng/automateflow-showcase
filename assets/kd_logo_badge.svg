<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C394" />
      <stop offset="50%" stop-color="#C59B63" />
      <stop offset="100%" stop-color="#9E733D" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241E1A" />
      <stop offset="100%" stop-color="#14110E" />
    </linearGradient>
  </defs>
  
  <!-- Background Badge -->
  <rect x="6" y="6" width="188" height="188" rx="28" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3" />
  
  <!-- Subtle Architectural Border Inset -->
  <rect x="18" y="18" width="164" height="164" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="6,4" />
  
  <!-- Door / Cabinet Architectural Motif -->
  <path d="M 60 48 L 140 48 M 100 48 L 100 86" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5" />
  
  <!-- Main Typography "KD" -->
  <text x="100" y="126" font-family="'Playfair Display', Georgia, serif" font-size="64" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">KD</text>
  
  <!-- Subtext "KITCHENS & DOORS" -->
  <text x="100" y="152" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#E5C394" text-anchor="middle" letter-spacing="3.5">KITCHENS &amp; DOORS</text>
  
  <!-- Location "MANSA" -->
  <text x="100" y="168" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8" font-weight="600" fill="#A89480" text-anchor="middle" letter-spacing="3">FACTORY • MANSA</text>
</svg>

